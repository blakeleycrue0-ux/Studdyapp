<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Configura tu perfil — Studdy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0D14">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body class="screen">

<div class="boot" id="boot">
  <div class="boot__inner"><span class="spinner"></span><span>Cargando…</span></div>
</div>

<div class="flow">
  <div class="flow__top">
    <button class="flow__back" id="back" type="button" aria-label="Atrás" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <div class="progress"><div class="progress__fill" id="fill" style="width:0%"></div></div>
  </div>

  <div class="flow__body" id="body"></div>

  <div class="flow__foot">
    <div id="error"></div>
    <p class="flow__note" id="note" hidden></p>
    <button class="btn btn--primary btn--lg btn--block" id="next" type="button" disabled>
      Continuar
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/data/fp.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
