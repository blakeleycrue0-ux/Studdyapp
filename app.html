<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studdy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0D14">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<div class="boot" id="boot">
  <div class="boot__inner"><span class="spinner"></span><span>Cargando…</span></div>
</div>

<div class="shell">
  <main class="main" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <a class="tab" href="#/inicio" data-section="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.8 1.8 0 0 1-1.8 1.8H5.3A1.8 1.8 0 0 1 3.5 19v-8.8Z"/>
        <path d="M9.5 20.8v-6.3h5v6.3"/>
      </svg>
      Inicio
      <span class="tab__dot"></span>
    </a>

    <a class="tab" href="#/apuntes" data-section="apuntes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4.2A1.7 1.7 0 0 1 6.7 2.5H18a1.5 1.5 0 0 1 1.5 1.5v16A1.5 1.5 0 0 1 18 21.5H6.7A1.7 1.7 0 0 1 5 19.8V4.2Z"/>
        <path d="M5 17.2h14.5M9 6.8h6M9 10.5h4"/>
      </svg>
      Apuntes
      <span class="tab__dot"></span>
    </a>

    <a class="tab" href="#/repasar" data-section="repasar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
        <path d="M20.5 3.5V9H15"/>
        <path d="M12 8v4.4l3 1.8"/>
      </svg>
      Repasar
      <span class="tab__dot"></span>
    </a>

    <a class="tab" href="#/chat" data-section="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 12.5a7.5 7.5 0 0 1-10.9 6.7L4 20.5l1.4-5.4A7.5 7.5 0 1 1 20.5 12.5Z"/>
        <path d="m13.6 8.2.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9Z"/>
      </svg>
      Chat
      <span class="tab__dot"></span>
    </a>

    <a class="tab" href="#/perfil" data-section="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4.5 20.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/>
      </svg>
      Perfil
      <span class="tab__dot"></span>
    </a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data/fp.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/notebook.js"></script>
<script src="js/views/flashcards.js"></script>
<script src="js/views/exams.js"></script>
<script src="js/views/presentations.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/exercises.js"></script>
<script src="js/views/writing.js"></script>
<script src="js/views/profile.js"></script>
<script>Studdy.app.start();</script>

</html>
