<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studdy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">

<div class="boot" id="boot">
  <div class="boot__inner"><span class="spinner"></span><span>Cargando…</span></div>
</div>

<div class="shell">

  <aside class="side">
    <a class="brand side__brand" href="app.html#/apuntes">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 9 12 4 2 9l10 5 10-5Z"/>
          <path d="M6 11.5V17c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-5.5"/>
        </svg>
      </span>
      Studdy
    </a>

    <nav class="side__nav" id="nav">
      <a class="nav-link" href="#/apuntes" data-section="apuntes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8.5" y="2.5" width="12" height="5" rx="1.5"/>
          <rect x="8.5" y="16.5" width="12" height="5" rx="1.5"/>
          <rect x="8.5" y="9.5" width="12" height="5" rx="1.5"/>
          <path d="M3.5 5h2.5v14H3.5M6 12h2.5"/>
        </svg>
        Apuntes
      </a>

      <a class="nav-link" href="#/flashcards" data-section="flashcards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="6.5" width="14" height="15" rx="2.5"/>
          <path d="M6.5 3.5h11a3 3 0 0 1 3 3v11"/>
          <path d="M6.5 12.5h6M6.5 16.5h3.5"/>
        </svg>
        Flashcards
      </a>

      <a class="nav-link" href="#/examenes" data-section="examenes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 3.5h-2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-14a2 2 0 0 0-2-2h-2"/>
          <rect x="8.5" y="1.8" width="7" height="4" rx="1.4"/>
          <path d="M8.6 13.2l2 2 4.3-4.4"/>
        </svg>
        Exámenes
      </a>

      <a class="nav-link" href="#/chat" data-section="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 12.5a7.5 7.5 0 0 1-10.9 6.7L4 20.5l1.4-5.4A7.5 7.5 0 1 1 20.5 12.5Z"/>
          <path d="m13.6 8.2.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9Z"/>
        </svg>
        Chat
      </a>

      <a class="nav-link" href="#/presentaciones" data-section="presentaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="3.5" width="19" height="12.5" rx="2"/>
          <path d="M12 16v5M8.5 21h7"/>
          <path d="M6.5 12.2 9.8 8.6l2.4 2.3 3.1-3.6"/>
        </svg>
        Presentaciones
      </a>
    </nav>

    <div class="side__foot">
      <div class="side__user">
        <div class="side__user-name" id="user-name"></div>
        <div class="side__user-level" id="user-level"></div>
      </div>
      <button class="link-button" type="button" id="logout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="main__inner" id="view"></div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/flashcards.js"></script>
<script src="js/views/exams.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/presentations.js"></script>
<script>Studdy.app.start();</script>
</body>
</html>
